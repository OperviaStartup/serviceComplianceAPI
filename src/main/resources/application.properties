spring.application.name=serviceCompliance

server.port=${PORT:8080}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
app.bootstrap.supervisor-email=${BOOTSTRAP_SUPERVISOR_EMAIL:}
app.bootstrap.supervisor-password=${BOOTSTRAP_SUPERVISOR_PASSWORD:}
app.invitation.expiration-hours=${INVITATION_EXPIRATION_HOURS:72}
app.invitation.base-url=${APP_INVITATION_BASE_URL:}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
