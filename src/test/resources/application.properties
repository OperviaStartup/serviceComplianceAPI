spring.datasource.url=jdbc:h2:mem:service_compliance_test
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.jwt.secret=test-only-secret-key-with-at-least-32-characters
app.jwt.expiration-ms=1800000
app.bootstrap.supervisor-email=
app.bootstrap.supervisor-password=
app.invitation.expiration-hours=72
app.invitation.base-url=https://test.example/invitations/accept
app.resend.api-key=
app.resend.from-email=
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
